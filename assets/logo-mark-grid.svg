<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Mindful Canvas logo construction grid">
  <title>Mindful Canvas — Logo Grid</title>
  <defs>
    <style>
      .grid { stroke: #e2b55a; fill: none; stroke-width: 0.35; opacity: 0.22; }
      .grid-major { stroke: #e2b55a; fill: none; stroke-width: 0.55; opacity: 0.38; }
      .axis { stroke: #e2b55a; fill: none; stroke-width: 0.45; opacity: 0.5; stroke-dasharray: 1.5 2; }
      .safe { stroke: #a0a0b0; fill: none; stroke-width: 0.4; opacity: 0.35; stroke-dasharray: 2 2; }
      .radius-guide { stroke: #e2b55a; fill: none; stroke-width: 0.4; opacity: 0.45; stroke-dasharray: 1.2 1.8; }
      .center { fill: #e2b55a; opacity: 0.7; }
      .line-back { stroke: #6e6e7a; fill: none; stroke-linecap: butt; }
      .line-front { stroke: #d4a84f; fill: none; stroke-linecap: butt; }
      .disc { fill: #f0c96e; }
      .label { fill: #a0a0b0; font-family: system-ui, sans-serif; font-size: 3px; opacity: 0.65; }
    </style>
  </defs>

  <g class="grid">
    <path d="M10 0 V100 M20 0 V100 M30 0 V100 M40 0 V100 M60 0 V100 M70 0 V100 M80 0 V100 M90 0 V100" />
    <path d="M0 10 H100 M0 20 H100 M0 30 H100 M0 40 H100 M0 60 H100 M0 70 H100 M0 80 H100 M0 90 H100" />
  </g>

  <rect class="grid-major" x="0" y="0" width="100" height="100" />
  <rect class="safe" x="8" y="8" width="84" height="84" />

  <line class="axis" x1="50" y1="8" x2="50" y2="92" />
  <line class="axis" x1="8" y1="50" x2="92" y2="50" />
  <line class="axis" x1="8" y1="8" x2="92" y2="92" />
  <line class="axis" x1="8" y1="92" x2="92" y2="8" />

  <circle class="radius-guide" cx="50" cy="50" r="20.5" />
  <circle class="center" cx="50" cy="50" r="0.9" />
  <text class="label" x="52.5" y="49">C</text>
  <text class="label" x="69" y="52">R=20.5</text>

  <g id="mark">
    <line class="line-back" x1="10" y1="10" x2="90" y2="90" stroke-width="4" />
    <circle class="disc" cx="50" cy="50" r="20.5" />
    <line class="line-front" x1="10" y1="90" x2="90" y2="10" stroke-width="5.5" />
  </g>

  <text class="label" x="8" y="97">transparent · gray W=4 · gold W=5.5</text>
</svg>
